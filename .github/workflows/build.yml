# נכתב: 2026-11-01 10:40 (שעון ישראל) — בניית APK של חייגן משופר
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release APK
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ImprovedDialer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ImprovedDialer-apk
          path: ImprovedDialer.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: חייגן משופר 1.0.${{ github.run_number }}
          files: ImprovedDialer.apk
          make_latest: true
